version: 2.1

jobs:
  validate:
    parallelism: 2
    docker:
      - image: cimg/python:3.12.8@sha256:6c162c73ea0c4af3d63fa3a7725991af19d86c0a10235109d927950539bca05d
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify migrated sources and tool pins
          command: python3 -B scripts/check-source.py
      - run:
          name: Install declared validation dependencies
          command: |
            python3 -m venv /tmp/dots-validation-venv
            /tmp/dots-validation-venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements/codex-validation-ci.lock
      - run:
          name: Check Python style
          command: /tmp/dots-validation-venv/bin/ruff check --no-cache .
      - run:
          name: Install pinned policy-checking tools
          command: |
            mkdir -p /tmp/dots-ci-tools /tmp/dots-ci-downloads
            for tool in fd ripgrep; do
              version="$(python3 -c 'import sys,tomllib; d=tomllib.load(open("mise/mise.lock","rb")); print(d["tools"][sys.argv[1]][0]["version"])' "$tool")"
              url="$(python3 -c 'import sys,tomllib; d=tomllib.load(open("mise/mise.lock","rb")); print(d["tools"][sys.argv[1]][0]["platforms.linux-x64"]["url"])' "$tool")"
              digest="$(python3 -c 'import sys,tomllib; d=tomllib.load(open("mise/mise.lock","rb")); print(d["tools"][sys.argv[1]][0]["platforms.linux-x64"]["checksum"])' "$tool")"
              archive="/tmp/dots-ci-downloads/${tool}.tar.gz"
              curl -fsSL "$url" -o "$archive"
              printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --check --status
              if [ "$tool" = fd ]; then
                tar -xOzf "$archive" "fd-v${version}-x86_64-unknown-linux-musl/fd" > /tmp/dots-ci-tools/fd
              else
                tar -xOzf "$archive" "ripgrep-${version}-x86_64-unknown-linux-musl/rg" > /tmp/dots-ci-tools/rg
              fi
            done
            codex_version="$(python3 -c 'import tomllib; print(tomllib.load(open("mise/config.toml","rb"))["tools"]["npm:@openai/codex"])')"
            test "$codex_version" = 0.153.4
            codex_archive=/tmp/dots-ci-downloads/codex.tar.gz
            curl -fsSL "https://github.com/openai/codex/releases/download/rust-v${codex_version}/codex-x86_64-unknown-linux-musl.tar.gz" -o "$codex_archive"
            printf '%s  %s\n' f479424eca092484dc40d87ae28c44f4cc40234a60045d6131e493800d814a30 "$codex_archive" | sha256sum --check --status
            tar -xOzf "$codex_archive" codex-x86_64-unknown-linux-musl > /tmp/dots-ci-tools/codex
            chmod 0755 /tmp/dots-ci-tools/fd /tmp/dots-ci-tools/rg /tmp/dots-ci-tools/codex
            /tmp/dots-ci-tools/fd --version
            /tmp/dots-ci-tools/rg --version
            /tmp/dots-ci-tools/codex --version
      - run:
          name: Verify public guidance and instruction links
          command: /tmp/dots-validation-venv/bin/python -B scripts/check-public-guidance.py
      - run:
          name: Test Linux CLI compatibility and disposable-home staging
          no_output_timeout: 15m
          command: |
            export PATH="/tmp/dots-ci-tools:/tmp/dots-validation-venv/bin:$PATH"
            export DOTS_CODEX_BIN=/tmp/dots-ci-tools/codex
            echo 'Linux pinned CLI compatibility only; Desktop app-runtime proof is a separate local check.'
            "$DOTS_CODEX_BIN" --version
            # Partition complete modules across the small runners. Every module
            # still runs in full, and any failure stops its required job.
            test_files=(tests/test_*.py)
            for index in "${!test_files[@]}"; do
              if (( index % CIRCLE_NODE_TOTAL == CIRCLE_NODE_INDEX )); then
                /tmp/dots-validation-venv/bin/python -B -m unittest discover -s tests -p "${test_files[index]##*/}" -v
              fi
            done
      - run:
          name: Check shell syntax
          command: bash -n scripts/resolve-homebrew-bin.sh

  secret-scan:
    docker:
      - image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
    resource_class: small
    steps:
      - checkout:
          method: full
      - run:
          name: Scan committed history and checked-out files
          command: |
            gitleaks git --no-banner --redact --log-level error .
            gitleaks dir --no-banner --redact --log-level error .

workflows:
  dots-validation:
    jobs:
      - validate
      - secret-scan
