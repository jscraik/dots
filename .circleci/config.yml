version: 2.1

jobs:
  validate:
    docker:
      - image: cimg/python:3.12.8
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify migrated sources and tool pins
          command: python3 -B scripts/check-source.py
      - run:
          name: Test disposable-home staging
          command: python3 -B -m unittest discover -s tests -v
      - run:
          name: Check shell syntax
          command: bash -n scripts/resolve-homebrew-bin.sh

  secret-scan:
    docker:
      - image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
    resource_class: small
    steps:
      - checkout:
          method: full
      - run:
          name: Scan committed history and checked-out files
          command: |
            gitleaks git --no-banner --redact --log-level error .
            gitleaks dir --no-banner --redact --log-level error .

workflows:
  dots-validation:
    jobs:
      - validate
      - secret-scan
