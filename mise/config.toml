[tools]
node = "25.9.0"
python = "3.14.4"
rust = "1.99.0"
ruby = "3.3.0"

# Package Managers
pnpm = "10.33.2"
uv = "0.11.3"
go = "1.26.4"

# Formatters and Linters
biome = "2.5.15"
vale = "3.15.1"
semgrep = "1.161.0"
betterleaks = "1.9.0"
ruff = "0.15.11"
golangci-lint = "2.12.2"

# System CLI Replacements
fzf = "0.74.4"
ripgrep = "15.1.0"
bat = "0.26.1"
eza = "0.23.5"
zoxide = "0.10.0"
# fd 10.4.x no longer ships darwin/x86_64 artifacts, so pin the newest installable release here.
fd = "10.3.0"
jq = "1.8.2"
gh = "2.102.0"

# Media tooling
ffmpeg = "9.0.2"
yt-dlp = { version = "2026.08.19", rename_exe = "yt-dlp" }

# PDF / OCR reading tooling is Homebrew-managed in the repo-root Brewfile, not mise.
# On Intel Sequoia hosts, if Homebrew requests packages.dunno_sequoia.jws.json,
# run brew commands with HOMEBREW_MACOS_VERSION=15 for that command.
# See Brewfile for the annotated formula list and run brew bundle --global.

# Network tooling is Homebrew-managed in the repo-root Brewfile when no mise
# provider is used. See Brewfile for annotated formulae.

# Dev Tools
yazi = "26.9.1"
tree-sitter = "0.26.9"
trivy = "0.70.0"
cosign = "3.0.6"
cloudflared = "2026.3.0"
sccache = "0.18.0"
starship = "1.26.0"

# NPM Globals managed directly via mise
"npm:typescript" = "7.0.2"
"npm:ts-node" = "10.9.2"
"npm:vite" = "8.3.3"
"npm:vitest" = "4.1.5"
"npm:create-vite" = "9.2.1"
"npm:@tauri-apps/cli" = "2.12.1"
"npm:storybook" = "10.6.1"
"npm:react-native-cli" = "2.0.1"
"npm:@argos-ci/cli" = "4.2.0"
"npm:beautiful-mermaid" = "1.1.3"
"npm:semver" = "7.7.4"
"npm:wrangler" = "4.84.1"
"npm:markdownlint-cli2" = "0.22.1"
"npm:next" = "16.4.0"
"npm:eslint" = "10.2.1"
"npm:agent-react-devtools" = "0.5.0"
"npm:@openai/codex" = "0.153.4"
"npm:@gitbook/cli" = "0.32.8"
"npm:portless" = "0.15.0"
# Disabled locally while @brainwav/coding-harness is unavailable from npm.
# Use the source repo command instead: pnpm exec tsx src/cli.ts ...
# "npm:@brainwav/coding-harness" = "0.15.0"
# Disabled locally while @brainwav/design-system-guidance is unavailable from npm.
# "npm:@brainwav/design-system-guidance" = "latest"
"npm:playwright" = "1.63.0"

# Cargo binaries managed directly via mise
"cargo:prek" = "0.3.10"
"cargo:lychee" = "0.24.2"
"npm:agent-browser" = "0.26.0"
"npm:agentation" = "3.0.2"
"npm:agentation-mcp" = "1.2.0"
"npm:ctx7" = "0.4.2"
"npm:@mermaid-js/mermaid-cli" = "11.12.0"
"npm:dialkit" = "2.0.2"
"npm:@brainwav/wsearch-cli" = "0.1.9"
yq = "4.54.1"
"cargo:taplo-cli" = "0.10.0"
"npm:@brainwav/rsearch" = "0.1.6"
"gem:bundler" = "2.4.19"

# The OpenAI API CLI is Homebrew-managed in Brewfile; the Python SDK no longer
# provides a console entrypoint. Keep Python tools with CLI entrypoints here.
"pipx:cairosvg" = "2.9.1"

# Import-only Python document/OCR/image reading libraries do not belong in pipx
# because several have no CLI entrypoint. Keep them in the activated mise Python
# user site using requirements/python-document-reading.txt.

zellij = "0.45.1"
"npm:@brainwav/diagram" = "1.1.0"
xcodegen = "2.46.0"
xcbeautify = "3.2.1"
# Use the published 0.14.x CLI here; 0.15.x work stays source-repo driven until published.
# "npm:@brainwav/coding-harness" = "0.14.0"

[tools."http:op-beta"]
version = "2.38.1-beta.01"
rename_exe = "op-beta"

[tools."http:op-beta".platforms]
macos-arm64 = { url = "https://cache.agilebits.com/dist/1P/op2/pkg/v{{ version }}/op_darwin_arm64_v{{ version }}.zip", checksum = "sha256:ca6bb537833c57269a7f87426e350434c35f3f0f0d725c5bb21c895ce2f3b3d7" }

[settings]

[settings.ruby]
compile = false

# Security / RE tools are Homebrew-managed in the repo-root Brewfile when they
# are available through brew or cask.
# IDA Pro - manual download from Hex-Rays (paid)
# Burp Suite Pro - manual download from PortSwigger (paid)
